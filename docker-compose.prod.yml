services:
  backend:
    image: levi1tabosa/fiscaliza-backend:latest
    container_name: fiscaliza-backend
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - API_KEY=${API_KEY}
    ports:
      - "8000:8000"
    networks:
      - fiscaliza-network
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "python scripts/init_db.py && python main.py"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    image: levi1tabosa/fiscaliza-frontend:latest
    container_name: fiscaliza-frontend
    restart: always
    ports:
      - "5173:5173"
    networks:
      - fiscaliza-network
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      backend:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    container_name: database
    restart: always
    environment:
      POSTGRES_DB: fiscaliza_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - fiscaliza-pgdata:/var/lib/postgresql/data
    networks:
      - fiscaliza-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d fiscaliza_db" ]
      interval: 5s
      timeout: 5s
      retries: 15

networks:
  fiscaliza-network:
    name: fiscaliza-network
    driver: bridge

volumes:
  fiscaliza-pgdata:
    name: fiscaliza-pgdata
