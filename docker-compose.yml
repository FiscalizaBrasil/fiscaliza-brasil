services:
  backend:
    image: fiscaliza-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fiscaliza_db
      - API_KEY=${API_KEY} # obtido  .env na pasta raiz do projeto
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - fiscaliza-network
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: sh -c "python scripts/init_db.py && python main.py"
    healthcheck:

      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    image: fiscaliza-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - fiscaliza-network
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_started

  postgres:
    image: postgres:18
    container_name: database
    environment:
      POSTGRES_DB: fiscaliza_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - fiscaliza-pgdata:/var/lib/postgresql/data
    networks:
      - fiscaliza-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fiscaliza_db"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 0s

networks:
  fiscaliza-network:
    name: fiscaliza-network
    driver: bridge

volumes:
  fiscaliza-pgdata:
    name: fiscaliza-pgdata
