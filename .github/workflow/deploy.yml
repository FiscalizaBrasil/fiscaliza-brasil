
name: Deploy to VPS

on:
  push:
    branches:
      - standalone          # triggers on every push to the standalone branch
  workflow_dispatch:  # allows manual trigger from the GitHub UI

#   DOCKERHUB_USERNAME   – your Docker Hub username
#   DOCKERHUB_TOKEN      – Docker Hub access token (not your password)
#   VPS_HOST             – public IP or hostname of your VPS
#   VPS_USER             – SSH user on the VPS (e.g. ubuntu, deploy)
#   VPS_SSH_KEY          – private SSH key whose public counterpart is in
#                          ~/.ssh/authorized_keys on the VPS
#   VPS_SSH_PORT         – SSH port (usually 22)
#
# Required repository variables (Settings → Secrets and variables → Actions → Variables):
#   IMAGE_BACKEND        – e.g. yourusername/tcc-backend
#   IMAGE_FRONTEND       – e.g. yourusername/tcc-frontend
#   DEPLOY_PATH          – absolute path to the project on the VPS
#                          (e.g. /home/ubuntu/tcc-I)

env:
  IMAGE_BACKEND:  ${{ vars.IMAGE_BACKEND  || 'fiscaliza-backend'  }}
  IMAGE_FRONTEND: ${{ vars.IMAGE_FRONTEND || 'fiscaliza-frontend' }}
  DEPLOY_PATH:    ${{ vars.DEPLOY_PATH    || '/opt/fiscaliza-brasil'   }}

jobs:
  # 1. Build & Push
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Required for cross-compiling to ARM64 on the x86 GitHub runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Enable Docker layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Backend
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/arm64 # change if you want to target a different architecture (e.g. linux/amd64 for x86 VPS)
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # Frontend
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/arm64   # target ARM VPS
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # 2. Deploy
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push   # only runs after images are pushed successfully

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Copy the compose file to the VPS so docker compose pull/up can use it
      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_SSH_PORT }}
          source:   "docker-compose.yml"
          target:   ${{ env.DEPLOY_PATH }}

      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_SSH_PORT }}
          envs: IMAGE_BACKEND,IMAGE_FRONTEND,DEPLOY_PATH
          script: |
            set -e

            cd "$DEPLOY_PATH"

            # Pull the newly built images (no rebuild on the VPS)
            docker compose pull

            # Restart only changed containers; keep DB running
            docker compose up -d --remove-orphans

            # Remove dangling images to reclaim disk space
            docker image prune -f

